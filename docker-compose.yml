version: "3.8"

services:
  leantime_db:
    image: mysql:8.4
    container_name: mysql_leantime
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    env_file: ./.env
    networks:
      - leantime-net
    command: --character-set-server=UTF8MB4 --collation-server=UTF8MB4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  leantime:
    image: leantime/leantime:${LEAN_VERSION:-latest}
    container_name: leantime
    restart: unless-stopped
    env_file: ./.env
    security_opt:
      - no-new-privileges:true
    cap_add:
      - CAP_CHOWN
      - CAP_SETGID
      - CAP_SETUID
    ports:
      - "${LEAN_PORT:-4545}:8080"
    networks:
      - leantime-net
    volumes:
      # Persistent volumes
      - public_userfiles:/var/www/html/public/userfiles
      - userfiles:/var/www/html/userfiles
      - plugins:/var/www/html/app/Plugins
      - logs:/var/www/html/storage/logs

      # ✅ Override logos with your custom branding
      - ./branding/logo.svg:/var/www/html/public/dist/images/logo.svg
      - ./branding/logo.svg:/var/www/html/public/dist/logo.svg

      # ✅ Replace footer "powered by Leantime" logo
      - ./branding/logo-powered-by-leantime.png:/var/www/html/public/dist/images/logo-powered-by-leantime.png

      # ✅ Override favicon
      - ./branding/favicon.ico:/var/www/html/public/favicon.ico
    depends_on:
      leantime_db:
        condition: service_healthy

  # Helper to fix MySQL volume permissions if needed
  mysql_helper:
    image: mysql:8.4
    command: chown -R mysql:mysql /var/lib/mysql
    volumes:
      - db_data:/var/lib/mysql
    user: root
    profiles: ["helper"]

volumes:
  db_data:
  userfiles:
  public_userfiles:
  plugins:
  logs:

networks:
  leantime-net: